<main class="page wish-page" data-palette="cool-blue">
<header class="wish-head"><p class="coord-label dim">A WISH ACROSS CHINA</p><h1>留一颗星星，<br>陪他慢慢长大。</h1><p class="dim-text">选中一座城市，写下一句想说的话。<br>它会先经过审核，再出现在这片光里。</p><p class="coord-label dim" id="wish-summary">LOCATING...</p></header>
<section class="wish-workspace" aria-label="祝福地图"><form class="wish-compose" id="wish-form"><p class="coord-label">✦ ONE WISH / ONE LIGHT</p><label>署名<input id="wish-name" maxlength="16" autocomplete="nickname" placeholder="一个你喜欢的昵称" required></label><div class="wish-location"><label>省级地区<select id="wish-province" required></select></label><label>城市<select id="wish-city" required></select></label></div><label>写给魏子宸的一句话<textarea id="wish-content" minlength="2" maxlength="100" placeholder="愿你一直被爱与星光包围……" required></textarea></label><label class="wish-trap" aria-hidden="true">不要填写<input id="wish-website" tabindex="-1" autocomplete="off"></label><p class="dim-text">请勿留下学校、住址、电话或社交账号等个人信息。</p><button class="coord-label" type="submit" id="wish-submit">变成星星 →</button><p class="coord-label dim" id="wish-status" role="status"></p></form>
<div class="wish-map" id="wish-map" aria-label="中国城市祝福分布"><img src="/world-map.svg?v=20260912-1710" alt="地图轮廓"><div class="wish-map-points" id="wish-map-points"></div><div class="wish-map-note"><span class="coord-label dim">SELECTED COORDINATE</span><strong id="wish-selected">—</strong><small id="wish-selected-count">0 次晨光</small></div></div></section>
<section class="wish-stream" aria-label="已经留下的祝福"><p class="coord-label dim">VISIBLE LIGHTS / <span id="wish-visible-count">000</span></p><div id="wish-list"></div></section></main>

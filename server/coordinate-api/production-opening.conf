# Include in the existing hk.weizichen.cn server; original root/API remain intact.
location = / {
    root /var/www/shining-opening;
    try_files /stars.html =404;
    add_header Cache-Control "no-cache" always;
}
location ~ ^/(stars|coord|map|routes|route|archive|about|today|v1)\.html$ {
    root /var/www/shining-opening;
}
location ^~ /ui/ {
    alias /var/www/shining-opening/ui/;
}
location = /data/archive.json {
    alias /var/www/shining-opening/data/archive.json;
}
location @shining_opening_asset {
    root /var/www/shining-opening;
    try_files $uri =404;
}
location ^~ /server/ { deny all; }
location ~ /\. { deny all; }

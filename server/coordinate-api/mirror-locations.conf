# Included inside the mirror's existing server block; keep /api/wishes intact.
location = / {
    root /var/www/shining-mirror;
    try_files /stars.html =404;
    add_header Cache-Control "no-cache" always;
}
# /index.html and legacy routes/assets stay on /var/www/html unchanged.
location ~ ^/(stars|coord|map|routes|route|archive|about|today|v1)\.html$ {
    root /var/www/shining-mirror;
}
location ^~ /ui/ {
    alias /var/www/shining-mirror/ui/;
}
location = /data/archive.json {
    alias /var/www/shining-mirror/data/archive.json;
}
location ^~ /api/coordinates/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 4k;
    limit_req zone=shining_lights burst=30 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}
location ^~ /server/ { deny all; }
location ~ /\. { deny all; }
